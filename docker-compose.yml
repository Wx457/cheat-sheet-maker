version: '3.8'

services:
  # 1. Redis
  redis:
    image: redis:alpine
    container_name: cheat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # 2. FastAPI backend
  backend:
    init: true
    build: 
      context: ./backend
    container_name: cheat-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PDF_GENERATION_HOST=http://backend:8000
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; u='http://127.0.0.1:8000/health'; r=urllib.request.urlopen(u, timeout=5); body=json.loads(r.read().decode()); sys.exit(0 if body.get('status')=='ok' else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # 3. Qdrant vector store
  qdrant:
    image: qdrant/qdrant:v1.19.2  # 固定版本：与 qdrant-client 1.19.x 匹配，升级时两边同步
    container_name: cheat-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

volumes:
  redis_data:
  qdrant_storage:

networks:
  app_network:
    driver: bridge
